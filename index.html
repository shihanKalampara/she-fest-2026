<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiruvasantham 1501 - Noorul Huda Madrasa Kombamkallu</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She Fest">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1e-8f5w_srCHu4YcRYqZx5pdR7DNyEB9a">

    <style>
        :root {
            --primary: #0f172a;
            --accent-live: #ef4444;
            --accent-upcoming: #f59e0b;
            --accent-completed: #10b981;
            --accent-cancelled: #64748b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --primary: #38bdf8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; transition: background 0.3s, color 0.3s; }
        .container { max-width: 750px; margin: auto; background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); border: 1px solid var(--border-color); position: relative; transition: background 0.3s, border 0.3s; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; position: relative; }
        .settings-container { position: relative; display: none; }
        
        .settings-btn { background: transparent; color: var(--text-main); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; font-weight: bold; }
        .settings-btn:hover { background: rgba(0,0,0,0.05); }
        
        .dropdown-menu { display: none; position: absolute; right: 0; top: 48px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 220px; z-index: 100; overflow: hidden; }
        .user-profile-info { padding: 12px 14px; background: var(--bg-color); border-bottom: 1px solid var(--border-color); font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .dropdown-menu button { width: 100%; padding: 12px 14px; background: transparent; color: var(--text-main); border: none; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .dropdown-menu button:hover { background: var(--bg-color); }
        .dropdown-menu button.logout-opt { color: #ef4444; border-bottom: none; justify-content: flex-start; gap: 8px; }
        .dropdown-menu button.logout-opt:hover { background: #fef2f2; }

        h1 { text-align: center; color: var(--text-main); margin: 10px 0 5px 0; font-size: 24px; font-weight: 700; }
        .sub-heading { text-align: center; color: var(--text-muted); font-weight: 500; margin-bottom: 20px; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; }

        /* Auth Screen Styling */
        #auth-screen { text-align: center; padding: 30px 10px; }
        .auth-box { max-width: 320px; margin: auto; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .auth-box input { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); border-radius: 8px; box-sizing: border-box; font-size: 13px; outline: none; }
        .auth-btn { width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .toggle-text { font-size: 12px; text-align: center; margin-top: 15px; color: #2563eb; cursor: pointer; }

        #main-app { display: none; }

        .search-box { margin-bottom: 15px; }
        .search-input { width: 100%; padding: 10px 14px; font-size: 13px; border: 1px solid var(--border-color); border-radius: 10px; outline: none; box-sizing: border-box; background: var(--bg-color); color: var(--text-main); transition: all 0.3s; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05); }

        .progress-box { background: var(--bg-color); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; }
        .progress-bar-fill { background: linear-gradient(90deg, #10b981, #059669); height: 8px; width: 0%; transition: width 0.6s ease; border-radius: 4px; }

        .tab-buttons { display: flex; gap: 4px; margin-bottom: 15px; background: var(--bg-color); border: 1px solid var(--border-color); padding: 4px; border-radius: 10px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 8px 10px; font-size: 11px; font-weight: 600; border: none; border-radius: 8px; background: transparent; cursor: pointer; color: var(--text-muted); white-space: nowrap; }
        .tab-btn.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        .tab-pane { display: none; height: 400px; overflow-y: hidden; }
        .tab-pane.active-pane { display: block; }
        .scroll-container { height: 100%; overflow-y: auto; padding-bottom: 50px; }

        /* Schedule Card Styles with Heart Favorite Button */
        .schedule-card { background: var(--card-bg); border: 1px solid var(--border-color); border-left: 4px solid #cbd5e1; padding: 14px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; position: relative; transition: all 0.2s; }
        .schedule-card.favorited { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.03); }
        
        .card-content { flex: 1; padding-right: 10px; }
        .card-right { display: flex; align-items: center; gap: 10px; }

        /* Heart Favorite Button */
        .fav-btn { background: var(--bg-color); border: 1px solid var(--border-color); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: transform 0.2s, background 0.2s; }
        .fav-btn:hover { transform: scale(1.1); background: var(--border-color); }
        
        .result-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        
        .category-pill { font-size: 12px; font-weight: 700; color: #7c3aed; background: #f3e8ff; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; color: white; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
        .badge.Live { background: var(--accent-live); }
        .badge.Upcoming { background: var(--accent-upcoming); }
        .badge.Completed { background: var(--accent-completed); }
        .badge.Cancelled { background: var(--accent-cancelled); }
        
        .medal { font-size: 20px; margin-right: 10px; }
        .winner-row { background: var(--bg-color); padding: 10px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border-color); margin-bottom: 5px; display: flex; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <div style="width: 40px;"></div>
        <img src="https://lh3.googleusercontent.com/d/1e-8f5w_srCHu4YcRYqZx5pdR7DNyEB9a" alt="Logo" style="max-width: 150px; display: block; margin: auto;">
        
        <div class="settings-container" id="settingsContainer">
            <button class="settings-btn" onclick="toggleDropdown()">⋮</button>
            <div class="dropdown-menu" id="dropdownMenu">
                <div class="user-profile-info" id="userProfileName">👤 Loading...</div>
                <button onclick="toggleAutoScroll()" id="autoScrollToggleBtn">🔁 Auto Scroll: ON</button>
                <button onclick="toggleDarkMode()" id="darkModeToggleBtn">🌙 Dark Mode: OFF</button>
                <button onclick="resetMobile()">🔄 Reset Mobile</button>
                <button class="logout-opt" onclick="logout()">🚪 Logout</button>
            </div>
        </div>
    </div>
    
    <h1>She Fest 2026</h1>
    <div class="sub-heading">Noorul Huda Madrasa, Kombamkallu</div>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen">
        <div class="auth-box">
            <h3 id="form-title" style="margin-top:0; color:var(--text-main);">Login</h3>
            <div id="nameFieldContainer" style="display:none;">
                <label style="font-size: 11px; font-weight:600;">Your Name</label>
                <input type="text" id="regName" placeholder="Enter your full name">
            </div>
            <label style="font-size: 11px; font-weight:600;">Mobile Number (10 Digits)</label>
            <input type="text" id="authMobile" maxlength="10" placeholder="Enter 10-digit mobile number">
            
            <button class="auth-btn" id="authSubmitBtn" onclick="handleAuthAction()">Login</button>
            <div class="toggle-text" id="toggleAuthText" onclick="toggleAuthMode()">Don't have an account? Register</div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="main-app">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search name, class, program..." onkeyup="filterData()">
        </div>

        <div class="progress-box">
            <div class="progress-header">
                <span id="progress-pct-text">0%</span>
                <span id="progress-count-text">0/0</span>
            </div>
            <div style="background: var(--border-color); height: 8px; border-radius: 4px; margin-top: 8px;">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('live', this)">Live</button>
            <button class="tab-btn" onclick="switchTab('upcoming', this)">Upcoming</button>
            <button class="tab-btn" onclick="switchTab('completed', this)">Finished</button>
            <button class="tab-btn" onclick="switchTab('favorites', this)">❤️ Saved</button>
            <button class="tab-btn" onclick="switchTab('results', this)">Results</button>
        </div>

        <div id="live-pane" class="tab-pane active-pane"><div id="live-list" class="scroll-container"></div></div>
        <div id="upcoming-pane" class="tab-pane"><div id="upcoming-list" class="scroll-container"></div></div>
        <div id="completed-pane" class="tab-pane"><div id="completed-list" class="scroll-container"></div></div>
        <div id="favorites-pane" class="tab-pane"><div id="favorites-list" class="scroll-container"></div></div>
        <div id="results-pane" class="tab-pane"><div id="results-list" class="scroll-container"></div></div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed:', err));
        });
    }

    const sheetURL = "https://script.google.com/macros/s/AKfycbwrQMmCEFoGI9rQlWxV-sfX0I6mvtCUcJCSanary60Em_XGKDX9IZApHxfFTy8cQbBS1w/exec";
    let globalScheduleData = [];
    let globalResultsData = [];
    let isRegisterMode = false;
    let isAutoScrollEnabled = localStorage.getItem("she_fest_autoscroll") !== "false";
    let isDarkModeEnabled = localStorage.getItem("she_fest_darkmode") === "true";
    let favorites = JSON.parse(localStorage.getItem("she_fest_favorites") || "[]");
    let previousLivePrograms = [];

    window.onload = function() {
        if (isDarkModeEnabled) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        updateDarkModeUI();
        updateAutoScrollUI();

        let savedMobile = localStorage.getItem("she_fest_user");
        let savedName = localStorage.getItem("she_fest_name");
        if (savedMobile) {
            showMainApp();
            if (savedName && savedName !== "undefined" && savedName !== "null") {
                document.getElementById("userProfileName").innerText = "👤 " + savedName;
            } else {
                document.getElementById("userProfileName").innerText = "👤 User";
            }
        }
    };

    function toggleDropdown() {
        let menu = document.getElementById("dropdownMenu");
        menu.style.display = menu.style.display === "block" ? "none" : "block";
    }

    window.onclick = function(event) {
        if (!event.target.matches('.settings-btn') && !event.target.closest('.settings-btn')) {
            let menu = document.getElementById("dropdownMenu");
            if (menu && menu.style.display === "block") {
                menu.style.display = "none";
            }
        }
    }

    function toggleAutoScroll() {
        isAutoScrollEnabled = !isAutoScrollEnabled;
        localStorage.setItem("she_fest_autoscroll", isAutoScrollEnabled);
        updateAutoScrollUI();
    }

    function updateAutoScrollUI() {
        let btn = document.getElementById("autoScrollToggleBtn");
        if (btn) {
            btn.innerHTML = isAutoScrollEnabled ? "🔁 Auto Scroll: ON" : "⏸️ Auto Scroll: OFF";
        }
    }

    function toggleDarkMode() {
        isDarkModeEnabled = !isDarkModeEnabled;
        localStorage.setItem("she_fest_darkmode", isDarkModeEnabled);
        if (isDarkModeEnabled) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        updateDarkModeUI();
    }

    function updateDarkModeUI() {
        let btn = document.getElementById("darkModeToggleBtn");
        if (btn) {
            btn.innerHTML = isDarkModeEnabled ? "☀️ Dark Mode: ON" : "🌙 Dark Mode: OFF";
        }
    }

    function toggleFavorite(progName, event) {
        event.stopPropagation();
        if (favorites.includes(progName)) {
            favorites = favorites.filter(item => item !== progName);
        } else {
            favorites.push(progName);
        }
        localStorage.setItem("she_fest_favorites", JSON.stringify(favorites));
        renderLists(globalScheduleData, globalResultsData);
    }

    function requestNotificationPermission() {
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
    }

    function checkLiveAlerts(scheduleData) {
        if (!("Notification" in window) || Notification.permission !== "granted") return;

        scheduleData.forEach(item => {
            let status = item.Status ? item.Status.trim().toLowerCase() : '';
            let progName = item['Program Type'] || 'Program';
            let studentName = item['Student Name'] || '';

            if (status === 'live' && !previousLivePrograms.includes(progName)) {
                new Notification("🔴 Live Now: " + progName, {
                    body: `${studentName} - Stage is live now!`,
                    icon: "https://lh3.googleusercontent.com/d/1e-8f5w_srCHu4YcRYqZx5pdR7DNyEB9a"
                });
            }
        });

        previousLivePrograms = scheduleData
            .filter(item => (item.Status || '').trim().toLowerCase() === 'live')
            .map(item => item['Program Type']);
    }

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        if (isRegisterMode) {
            document.getElementById("form-title").innerText = "Register Account";
            document.getElementById("nameFieldContainer").style.display = "block";
            document.getElementById("authSubmitBtn").innerText = "Register";
            document.getElementById("toggleAuthText").innerText = "Already have an account? Login";
        } else {
            document.getElementById("form-title").innerText = "Login";
            document.getElementById("nameFieldContainer").style.display = "none";
            document.getElementById("authSubmitBtn").innerText = "Login";
            document.getElementById("toggleAuthText").innerText = "Don't have an account? Register";
        }
    }

    function handleAuthAction() {
        let mobile = document.getElementById("authMobile").value.trim();
        let name = document.getElementById("regName").value.trim();

        if (!mobile || !/^\d{10}$/.test(mobile)) {
            alert("Please enter a valid 10-digit mobile number!");
            return;
        }

        let payload = { action: isRegisterMode ? "register" : "login", mobile: mobile };
        if (isRegisterMode) {
            if (!name) { alert("Please enter your name!"); return; }
            payload.name = name;
        }

        document.getElementById("authSubmitBtn").innerText = "Processing...";

        fetch(sheetURL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                localStorage.setItem("she_fest_user", mobile);
                // ഡാറ്റയിൽ നിന്ന് വരുന്നതോ യൂസർ നൽകിയതോ ആയ പേര് സേവ് ചെയ്യുക
                let finalName = data.name || (isRegisterMode && name ? name : "User");
                localStorage.setItem("she_fest_name", finalName);
                showMainApp();
            } else if (data.status === "invalid_mobile") {
                alert("Invalid mobile number format.");
            } else if (data.status === "exists") {
                alert("Mobile number already registered! Please login.");
            } else if (data.status === "blocked") {
                alert("Your account access has been blocked by admin.");
            } else {
                alert("Mobile number not registered. Please register first.");
            }
            document.getElementById("authSubmitBtn").innerText = isRegisterMode ? "Register" : "Login";
        })
        .catch(err => {
            alert("Error connecting to server!");
            document.getElementById("authSubmitBtn").innerText = isRegisterMode ? "Register" : "Login";
        });
    }

    function resetMobile() {
        let currentMobile = localStorage.getItem("she_fest_user");
        let newMobile = prompt("Enter your new 10-digit mobile number:");
        if (!newMobile) return;
        newMobile = newMobile.trim();

        if (!/^\d{10}$/.test(newMobile)) {
            alert("Please enter a valid 10-digit mobile number!");
            return;
        }

        fetch(sheetURL, {
            method: "POST",
            body: JSON.stringify({ action: "reset", mobile: currentMobile, newMobile: newMobile })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                alert("Mobile number updated successfully! Please login again.");
                logout();
            } else if (data.status === "exists") {
                alert("This mobile number is already registered!");
            } else {
                alert("Error updating mobile number.");
            }
        })
        .catch(err => alert("Error connecting to server!"));
    }

    function showMainApp() {
        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("main-app").style.display = "block";
        document.getElementById("settingsContainer").style.display = "block";
        
        let savedName = localStorage.getItem("she_fest_name") || "User";
        document.getElementById("userProfileName").innerText = "👤 " + savedName;

        requestNotificationPermission();
        fetchSchedule();
        setInterval(fetchSchedule, 10000);
    }

    function logout() {
        localStorage.removeItem("she_fest_user");
        localStorage.removeItem("she_fest_name");
        location.reload();
    }

    function switchTab(t, b) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active-pane'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(t + '-pane').classList.add('active-pane');
        b.classList.add('active');
    }

    function createCard(item) {
        let status = item.Status ? item.Status.trim() : 'Upcoming';
        let studentText = item['Student Name'] || '';
        let classText = item.Class ? item.Class.trim() : '';
        let displaySubText = classText ? `${studentText} (${classText})` : studentText;
        let progType = item['Program Type'] || '';
        let isFav = favorites.includes(progType);

        let card = document.createElement("div");
        card.className = `schedule-card ${isFav ? 'favorited' : ''}`;
        card.innerHTML = `
            <div class="card-content">
                <span style="font-size:12px; font-weight:600;">${item.Time}</span><br>
                <b>${progType}</b><br>
                <small>${displaySubText}</small>
            </div>
            <div class="card-right">
                <button class="fav-btn" onclick="toggleFavorite('${progType}', event)" title="Save to Favorites">
                    ${isFav ? '❤️' : '🤍'}
                </button>
                <span class="badge ${status}">${status}</span>
            </div>`;
        return card;
    }

    function createResultCard(item) {
        let card = document.createElement("div");
        card.className = "result-card";
        card.innerHTML = `
            <div class="result-header">
                <b>${item['Program Name'] || 'Program'}</b>
                <span class="category-pill">${item.Category || 'General'}</span>
            </div>
            ${item['1st Place'] ? `<div class="winner-row"><span class="medal">🥇</span> ${item['1st Place']}</div>` : ''}
            ${item['2nd Place'] ? `<div class="winner-row"><span class="medal">🥈</span> ${item['2nd Place']}</div>` : ''}
            ${item['3rd Place'] ? `<div class="winner-row"><span class="medal">🥉</span> ${item['3rd Place']}</div>` : ''}
        `;
        return card;
    }

    setInterval(() => {
        if (!isAutoScrollEnabled) return;
        const searchVal = document.getElementById("searchInput").value;
        if (searchVal) return;
        const activeList = document.querySelector('.active-pane .scroll-container');
        if (activeList && activeList.scrollHeight > activeList.clientHeight) {
            activeList.scrollTop = (activeList.scrollTop + 1 >= activeList.scrollHeight - activeList.clientHeight) ? 0 : activeList.scrollTop + 1;
        }
    }, 50);

    function renderLists(scheduleData, resultsData) {
        document.getElementById("live-list").innerHTML = "";
        document.getElementById("upcoming-list").innerHTML = "";
        document.getElementById("completed-list").innerHTML = "";
        document.getElementById("favorites-list").innerHTML = "";
        document.getElementById("results-list").innerHTML = "";
        
        let finished = 0;
        
        scheduleData.forEach(item => {
            let status = item.Status ? item.Status.trim().toLowerCase() : '';
            let progType = item['Program Type'] || '';

            if (favorites.includes(progType)) {
                document.getElementById("favorites-list").appendChild(createCard(item));
            }

            if (status === 'completed' || status === 'finished') { 
                finished++; 
                document.getElementById("completed-list").appendChild(createCard(item)); 
            } else if (status === 'cancelled') { 
                document.getElementById("completed-list").appendChild(createCard(item)); 
            } else if (status === 'live') { 
                document.getElementById("live-list").appendChild(createCard(item)); 
            } else { 
                document.getElementById("upcoming-list").appendChild(createCard(item)); 
            }
        });

        resultsData.forEach(item => { 
            if (item['Program Name']) {
                document.getElementById("results-list").appendChild(createResultCard(item)); 
            }
        });

        let total = globalScheduleData.length;
        let pct = total > 0 ? Math.round((finished / total) * 100) : 0;
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("progress-pct-text").innerText = pct + "%";
        document.getElementById("progress-count-text").innerText = `${finished}/${total}`;
    }

    function filterData() {
        let query = document.getElementById("searchInput").value.toLowerCase().trim();
        
        if (!query) {
            renderLists(globalScheduleData, globalResultsData);
            return;
        }

        let filteredSchedule = globalScheduleData.filter(item => {
            let prog = (item['Program Type'] || '').toLowerCase();
            let name = (item['Student Name'] || '').toLowerCase();
            let cls = (item.Class || '').toLowerCase();
            return prog.includes(query) || name.includes(query) || cls.includes(query);
        });

        let filteredResults = globalResultsData.filter(item => {
            let progName = (item['Program Name'] || '').toLowerCase();
            let cat = (item.Category || '').toLowerCase();
            let first = (item['1st Place'] || '').toLowerCase();
            let second = (item['2nd Place'] || '').toLowerCase();
            let third = (item['3rd Place'] || '').toLowerCase();
            return progName.includes(query) || cat.includes(query) || first.includes(query) || second.includes(query) || third.includes(query);
        });

        renderLists(filteredSchedule, filteredResults);
    }

    function fetchSchedule() {
        let savedMobile = localStorage.getItem("she_fest_user");
        if (!savedMobile) return;

        fetch(sheetURL)
            .then(r => r.json())
            .then(response => {
                globalScheduleData = response.schedule || []; 
                globalResultsData = response.results || [];
                
                // ലോഗിൻ ചെയ്ത യൂസറുടെ പേര് റെസ്പോൺസിൽ നിന്ന് അപ്ഡേറ്റ് ചെയ്യാൻ ശ്രമിക്കുക
                if (response.users) {
                    let currentUser = response.users.find(u => String(u.Mobile) === String(savedMobile));
                    if (currentUser && currentUser.Name) {
                        localStorage.setItem("she_fest_name", currentUser.Name);
                        document.getElementById("userProfileName").innerText = "👤 " + currentUser.Name;
                    }
                }

                checkLiveAlerts(globalScheduleData);
                filterData();
            })
            .catch(err => console.log("Fetch error:", err));
    }
</script>
