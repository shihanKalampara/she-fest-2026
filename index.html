<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fest & Quiz App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #4CAF50; }
        .btn { display: block; width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #45a049; }
        .question-box { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; }
        .options label { display: block; margin: 5px 0; cursor: pointer; }
        #quiz-section, #rank-section { margin-top: 20px; }
        .rank-item { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h2>ക്വിസ് പ്രോഗ്രാം</h2>
    
    <!-- ലോഗിൻ / യൂസർ വിവരങ്ങൾ -->
    <div id="user-info-section">
        <p id="welcome-msg">കണ്ടിന്യൂ ചെയ്യാൻ മൊബൈൽ നമ്പർ നൽകുക:</p>
        <input type="text" id="mobile-input" placeholder="മൊബൈൽ നമ്പർ നൽകുക" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
        <input type="text" id="name-input" placeholder="നിങ്ങളുടെ പേര്" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
        <button class="btn" onclick="startQuizUser()">തുടടങ്ങുക / ക്വിസ് എടുക്കുക</button>
    </div>

    <!-- ക്വിസ് ചോദ്യങ്ങൾ കാണിക്കുന്ന ഭാഗം -->
    <div id="quiz-section" style="display:none;">
        <div id="questions-container"></div>
        <button class="btn" onclick="submitQuizAnswers()">ഉത്തരങ്ങൾ സബ്മിറ്റ് ചെയ്യുക</button>
    </div>

    <!-- സബ്മിറ്റ് ചെയ്തുകഴിഞ്ഞുള്ള സന്ദേശം -->
    <div id="submitted-msg-section" style="display:none; text-align:center; margin-top: 20px;">
        <h3 style="color: #2196F3;">നിങ്ങളുടെ ഉത്തരങ്ങൾ വിജയകരമായി സമർപ്പിച്ചു!</h3>
        <p>റാങ്ക് ലിസ്റ്റ് പ്രസിദ്ധീകരിക്കുമ്പോൾ നിങ്ങളുടെ മാർക്ക് ഇവിടെ അറിയാൻ സാധിക്കുന്നതാണ്.</p>
    </div>

    <!-- റാങ്ക് ലിസ്റ്റ് കാണിക്കുന്ന ഭാഗം (ക്വിസ് ക്ലോസ് ചെയ്താൽ മാത്രം) -->
    <div id="rank-section" style="display:none;">
        <h3>റാങ്ക് ലിസ്റ്റ് & മാർക്കുകൾ</h3>
        <p id="user-personal-score" style="font-weight: bold; color: #4CAF50;"></p>
        <div id="rank-list-container"></div>
    </div>
</div>

<script>
    // നിങ്ങളുടെ ഗൂഗിൾ ആപ്സ് സ്ക്രിപ്റ്റിന്റെ വെബ് ആപ്പ് ലിങ്ക് ഇവിടെ നൽകുക
    const scriptURL = "https://script.google.com/macros/s/AKfycbyaoA5rhfRU1bGeuiGC0bDhh7otuQvVq9rwkWvTXNcxlIhMYSH_imiMeYpdVPKJb28XGA/exec"; 

    let userMobile = "";
    let userName = "";
    let fetchedQuestions = [];

    function startQuizUser() {
        userMobile = document.getElementById("mobile-input").value.trim();
        userName = document.getElementById("name-input").value.trim();

        if (!userMobile) {
            alert("ദയവായി മൊബൈൽ നമ്പർ നൽകുക!");
            return;
        }

        // സെർവറിലേക്ക് സ്റ്റാർട്ട് റിക്വസ്റ്റ് അയക്കുന്നു
        fetch(scriptURL, {
            method: "POST",
            body: JSON.stringify({ action: "startQuiz", mobile: userMobile, name: userName })
        })
        .then(res => res.json())
        .then(data => {
            checkQuizStatus();
        })
        .catch(err => {
            console.error(err);
            alert("എന്തെങ്കിലും കുഴപ്പം സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.");
        });
    }

    function checkQuizStatus() {
        if (!userMobile) return;

        fetch(`${scriptURL}?action=getQuiz&mobile=${userMobile}`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("user-info-section").style.display = "none";

            if (data.quizStatus === "STARTED") {
                if (data.hasAnswered) {
                    // ഇതിനകം സബ്മിറ്റ് ചെയ്തിട്ടുണ്ടെങ്കിൽ
                    document.getElementById("submitted-msg-section").style.display = "block";
                } else {
                    // ചോദ്യങ്ങൾ ലോഡ് ചെയ്യുന്നു
                    fetchedQuestions = data.questions || [];
                    renderQuestions(fetchedQuestions);
                    document.getElementById("quiz-section").style.display = "block";
                }
            } else if (data.quizStatus === "CLOSED") {
                // ക്വിസ് ക്ലോസ് ചെയ്താൽ റാങ്ക് ലിസ്റ്റും സ്വന്തം മാർക്കും കാണിക്കുന്നു
                document.getElementById("quiz-section").style.display = "none";
                document.getElementById("submitted-msg-section").style.display = "none";
                
                if (data.score !== undefined) {
                    document.getElementById("user-personal-score").innerText = `നിങ്ങളുടെ സ്കോർ: ${data.score} മാർക്ക്`;
                }

                renderRankList(data.rankList || []);
                document.getElementById("rank-section").style.display = "block";
            } else {
                alert("ക്വിസ് ഇതുവരെ ആരംഭിച്ചിട്ടില്ല!");
                document.getElementById("user-info-section").style.display = "block";
            }
        })
        .catch(err => console.error(err));
    }

    function renderQuestions(questions) {
        const container = document.getElementById("questions-container");
        container.innerHTML = "";

        questions.forEach((q, index) => {
            let optionsHTML = "";
            q.options.forEach((opt, optIndex) => {
                if(opt) {
                    optionsHTML += `<label><input type="radio" name="q_${q.id}" value="${opt}"> ${opt}</label>`;
                }
            });

            container.innerHTML += `
                <div class="question-box">
                    <p><b>${index + 1}. ${q.question}</b></p>
                    <div class="options">${optionsHTML}</div>
                </div>
            `;
        });
    }

    function submitQuizAnswers() {
        let answers = {};
        fetchedQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
            if (selected) {
                answers[q.id] = selected.value;
            }
        });

        const payload = {
            action: "submitQuiz",
            mobile: userMobile,
            name: userName,
            answers: answers,
            timestamp: new Date().getTime()
        };

        fetch(scriptURL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                document.getElementById("quiz-section").style.display = "none";
                document.getElementById("submitted-msg-section").style.display = "block";
            }
        })
        .catch(err => {
            console.error(err);
            alert("സബ്മിറ്റ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു.");
        });
    }

    function renderRankList(rankList) {
        const container = document.getElementById("rank-list-container");
        container.innerHTML = "";

        if (rankList.length === 0) {
            container.innerHTML = "<p>റാങ്ക് ലിസ്റ്റുകൾ ലഭ്യമല്ല.</p>";
            return;
        }

        rankList.forEach((item, index) => {
            container.innerHTML += `
                <div class="rank-item">
                    <span><b>#${index + 1}</b> ${item.name}</span>
                    <span><b>${item.score} മാർക്ക്</b></span>
                </div>
            `;
        });
    }
</script>

</body>
</html>
