<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She Fest 2026</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0f172a; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth" class="box">
    <h2 id="title">Login</h2>
    <input type="text" id="name" placeholder="Name (for registration only)" style="display:none;">
    <input type="text" id="mobile" placeholder="Mobile Number">
    <button id="btn" onclick="submit()">Login</button>
    <p style="text-align:center; color:blue; cursor:pointer;" onclick="toggle()">Register/Login</p>
</div>

<div id="app" style="display:none;">
    <h1>Welcome!</h1>
    <div id="data"></div>
</div>

<script>
    const url = "https://script.google.com/macros/s/AKfycbxl9RXu35GDn6i_-XKoUtKZDkstyIj6OIaxE0OjTtxrpNfPmMwrJ-7HwMZwi5L5TaVgZQ/exec"; // <-- ലിങ്ക് ഇവിടെ കൊടുക്കുക
    let mode = "login";

    function toggle() {
        mode = mode === "login" ? "register" : "login";
        document.getElementById("title").innerText = mode === "login" ? "Login" : "Register";
        document.getElementById("btn").innerText = mode === "login" ? "Login" : "Register";
        document.getElementById("name").style.display = mode === "register" ? "block" : "none";
    }

    async function submit() {
        const res = await fetch(url, {
            method: "POST",
            body: JSON.stringify({action: mode, mobile: document.getElementById("mobile").value, name: document.getElementById("name").value})
        });
        const data = await res.json();
        if(data.status === "success") {
            if(mode === "login") {
                localStorage.setItem("user", "true");
                document.getElementById("auth").style.display = "none";
                document.getElementById("app").style.display = "block";
                fetchData();
            } else { alert("Registered! Wait for admin approval."); }
        } else { alert(data.status); }
    }

    async function fetchData() {
        const res = await fetch(url);
        const data = await res.json();
        let html = "<h3>Schedule</h3>";
        data.schedule.forEach(i => html += `<p>${i['Program Type']} - ${i['Student Name']}</p>`);
        document.getElementById("data").innerHTML = html;
    }
</script>
</body>
</html>
