<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiruvasantham 1501 - Noorul Huda Madrasa Kombamkallu</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She Fest">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1e-8f5w_srCHu4YcRYqZx5pdR7DNyEB9a">

    <style>
        :root {
            --primary: #0f172a;
            --accent-live: #ef4444;
            --accent-upcoming: #f59e0b;
            --accent-completed: #10b981;
            --accent-cancelled: #64748b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        .container { max-width: 750px; margin: auto; background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        
        h1 { text-align: center; color: var(--primary); margin: 10px 0 5px 0; font-size: 24px; font-weight: 700; }
        .sub-heading { text-align: center; color: var(--text-muted); font-weight: 500; margin-bottom: 20px; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; }

        /* Search Bar */
        .search-box { margin-bottom: 15px; }
        .search-input { width: 100%; padding: 10px 14px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; box-sizing: border-box; background: #f8fafc; transition: all 0.3s; }
        .search-input:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05); }

        /* Progress Bar */
        .progress-box { background: #f1f5f9; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; }
        .progress-bar-fill { background: linear-gradient(90deg, #10b981, #059669); height: 8px; width: 0%; transition: width 0.6s ease; border-radius: 4px; }

        /* Tabs */
        .tab-buttons { display: flex; gap: 4px; margin-bottom: 15px; background: #f1f5f9; padding: 4px; border-radius: 10px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 8px 10px; font-size: 11px; font-weight: 600; border: none; border-radius: 8px; background: transparent; cursor: pointer; color: var(--text-muted); white-space: nowrap; }
        .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        .tab-pane { display: none; height: 400px; overflow-y: hidden; }
        .tab-pane.active-pane { display: block; }
        .scroll-container { height: 100%; overflow-y: auto; padding-bottom: 50px; }

        /* Cards */
        .schedule-card { background: #ffffff; border: 1px solid #e2e8f0; border-left: 4px solid #cbd5e1; padding: 14px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .result-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        
        /* Category Pill - Increased Size */
        .category-pill { font-size: 12px; font-weight: 700; color: #7c3aed; background: #f3e8ff; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Badges with Faster Animation (0.5s) */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; color: white; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
        .badge::before { content: ''; width: 6px; height: 6px; background: white; border-radius: 50%; animation: blink 0.5s infinite alternate; }
        @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
        
        .badge.Live { background: var(--accent-live); }
        .badge.Upcoming { background: var(--accent-upcoming); }
        .badge.Completed { background: var(--accent-completed); }
        .badge.Cancelled { background: var(--accent-cancelled); }
        
        .medal { font-size: 20px; margin-right: 10px; }
        .winner-row { background: #f8fafc; padding: 10px; border-radius: 8px; font-size: 13px; border: 1px solid #f1f5f9; margin-bottom: 5px; display: flex; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 15px;"><img src="https://lh3.googleusercontent.com/d/1e-8f5w_srCHu4YcRYqZx5pdR7DNyEB9a" alt="Logo" style="max-width: 200px;"></div>
    <h1>She Fest 2026</h1>
    <div class="sub-heading">Noorul Huda Madrasa, Kombamkallu</div>
    
    <!-- Search Bar -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search name, class, program..." onkeyup="filterData()">
    </div>

    <div class="progress-box">
        <div class="progress-header">
            <span id="progress-pct-text">0%</span>
            <span id="progress-count-text">0/0</span>
        </div>
        <div style="background: #e2e8f0; height: 8px; border-radius: 4px; margin-top: 8px;">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('live', this)">Live</button>
        <button class="tab-btn" onclick="switchTab('upcoming', this)">Upcoming</button>
        <button class="tab-btn" onclick="switchTab('completed', this)">Finished</button>
        <button class="tab-btn" onclick="switchTab('offstage', this)">Results</button>
    </div>

    <div id="live-pane" class="tab-pane active-pane"><div id="live-list" class="scroll-container"></div></div>
    <div id="upcoming-pane" class="tab-pane"><div id="upcoming-list" class="scroll-container"></div></div>
    <div id="completed-pane" class="tab-pane"><div id="completed-list" class="scroll-container"></div></div>
    <div id="offstage-pane" class="tab-pane"><div id="offstage-list" class="scroll-container"></div></div>
</div>

<script>
    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered!', reg))
                .catch(err => console.log('SW registration failed:', err));
        });
    }

    const sheetURL = "https://script.google.com/macros/s/AKfycbwh0OjbaNuqey6Vmnyzv9AAw3dk1qTX1XwtLmW9Eq_Kpmdydd67eqeq4Qg_eif8uDYx-w/exec";
    let globalScheduleData = [];
    let globalResultsData = [];

    function switchTab(t, b) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active-pane'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(t + '-pane').classList.add('active-pane');
        b.classList.add('active');
    }

    function createCard(item) {
        let status = item.Status ? item.Status.trim() : 'Upcoming';
        let studentText = item['Student Name'] || '';
        let classText = item.Class ? item.Class.trim() : '';
        let displaySubText = classText ? `${studentText} (${classText})` : studentText;

        let card = document.createElement("div");
        card.className = "schedule-card";
        card.innerHTML = `<div><span style="font-size:12px; font-weight:600;">${item.Time}</span><br><b>${item['Program Type']}</b><br><small>${displaySubText}</small></div>
                          <div><span class="badge ${status}">${status}</span></div>`;
        return card;
    }

    function createResultCard(item) {
        let card = document.createElement("div");
        card.className = "result-card";
        card.innerHTML = `
            <div class="result-header">
                <b>${item['Program Name'] || 'Program'}</b>
                <span class="category-pill">${item.Category || 'General'}</span>
            </div>
            ${item['1st Place'] ? `<div class="winner-row"><span class="medal">🥇</span> ${item['1st Place']}</div>` : ''}
            ${item['2nd Place'] ? `<div class="winner-row"><span class="medal">🥈</span> ${item['2nd Place']}</div>` : ''}
            ${item['3rd Place'] ? `<div class="winner-row"><span class="medal">🥉</span> ${item['3rd Place']}</div>` : ''}
        `;
        return card;
    }

    // Auto scroll logic (Paused if user is searching or scrolling manually)
    setInterval(() => {
        const searchVal = document.getElementById("searchInput").value;
        if (searchVal) return; // Don't auto scroll while searching
        const activeList = document.querySelector('.active-pane .scroll-container');
        if (activeList && activeList.scrollHeight > activeList.clientHeight) {
            activeList.scrollTop = (activeList.scrollTop + 1 >= activeList.scrollHeight - activeList.clientHeight) ? 0 : activeList.scrollTop + 1;
        }
    }, 50);

    function renderLists(scheduleData, resultsData) {
        document.getElementById("live-list").innerHTML = "";
        document.getElementById("upcoming-list").innerHTML = "";
        document.getElementById("completed-list").innerHTML = "";
        document.getElementById("offstage-list").innerHTML = "";
        
        let finished = 0;
        
        scheduleData.forEach(item => {
            let status = item.Status ? item.Status.trim().toLowerCase() : '';
            if (status === 'completed') { 
                finished++; 
                document.getElementById("completed-list").appendChild(createCard(item)); 
            }
            else if (status === 'cancelled') { 
                document.getElementById("completed-list").appendChild(createCard(item)); 
            }
            else if (status === 'live') { 
                document.getElementById("live-list").appendChild(createCard(item)); 
            }
            else { 
                document.getElementById("upcoming-list").appendChild(createCard(item)); 
            }
        });

        resultsData.forEach(item => { 
            if (item['Program Name']) {
                document.getElementById("offstage-list").appendChild(createResultCard(item)); 
            }
        });

        let total = globalScheduleData.length;
        let pct = total > 0 ? Math.round((finished / total) * 100) : 0;
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("progress-pct-text").innerText = pct + "%";
        document.getElementById("progress-count-text").innerText = `${finished}/${total}`;
    }

    function filterData() {
        let query = document.getElementById("searchInput").value.toLowerCase().trim();
        
        if (!query) {
            renderLists(globalScheduleData, globalResultsData);
            return;
        }

        let filteredSchedule = globalScheduleData.filter(item => {
            let prog = (item['Program Type'] || '').toLowerCase();
            let name = (item['Student Name'] || '').toLowerCase();
            let cls = (item.Class || '').toLowerCase();
            return prog.includes(query) || name.includes(query) || cls.includes(query);
        });

        let filteredResults = globalResultsData.filter(item => {
            let progName = (item['Program Name'] || '').toLowerCase();
            let cat = (item.Category || '').toLowerCase();
            let first = (item['1st Place'] || '').toLowerCase();
            let second = (item['2nd Place'] || '').toLowerCase();
            let third = (item['3rd Place'] || '').toLowerCase();
            return progName.includes(query) || cat.includes(query) || first.includes(query) || second.includes(query) || third.includes(query);
        });

        renderLists(filteredSchedule, filteredResults);
    }

    function fetchSchedule() {
        fetch(sheetURL).then(r => r.json()).then(response => {
            globalScheduleData = response.schedule || []; 
            globalResultsData = response.results || [];
            filterData(); // This will render data considering any active search query
        });
    }

    fetchSchedule();
    setInterval(fetchSchedule, 10000);
</script>
</body>
</html>
