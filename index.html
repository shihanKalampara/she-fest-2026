<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fest App - Shefest & Hefest</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #ec4899;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: var(--primary-color); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .secondary-btn { background: #6b7280; }
        .hidden { display: none !important; }
        .nav-tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
        .nav-tab { background: none; border: none; font-size: 15px; font-weight: bold; cursor: pointer; color: #4b5563; width: auto; padding: 5px 10px; margin: 0; }
        .nav-tab.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); }
        .card { background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary-color); }
        .quiz-option { display: block; background: #e5e7eb; padding: 10px; border-radius: 6px; margin: 8px 0; cursor: pointer; text-align: left; }
        .quiz-option:hover { background: #d1d5db; }
        #loading { text-align: center; font-weight: bold; color: #6b7280; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTH SECTION (Login / Register) -->
    <div id="authSection">
        <h2 id="authTitle">ലോഗിൻ ചെയ്യുക</h2>
        <div class="form-group">
            <label>പേര് (Name)</label>
            <input type="text" id="nameInput" placeholder="നിങ്ങളുടെ പേര് നൽകുക">
        </div>
        <div class="form-group">
            <label>മൊബൈൽ നമ്പർ (Mobile Number)</label>
            <input type="tel" id="mobileInput" placeholder="10 അക്ക മൊബൈൽ നമ്പർ">
        </div>
        <button id="authBtn" onclick="handleAuth()">ലോഗിൻ</button>
        <button class="secondary-btn" onclick="toggleAuthMode()" style="margin-top: 10px;">അക്കൗണ്ട് ഇല്ലെങ്കിൽ രജിസ്റ്റർ ചെയ്യാം</button>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appSection" class="hidden">
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('shefest')">Shefest</button>
            <button class="nav-tab" onclick="switchTab('hefest')">Hefest</button>
            <button class="nav-tab" onclick="switchTab('results')">Results</button>
            <button class="nav-tab" onclick="switchTab('quiz')">Quiz</button>
            <button class="nav-tab" onclick="switchTab('feedback')">Feedback</button>
        </div>

        <div id="loading">ലോഡ് ചെയ്യുന്നു... ഡാറ്റ കാത്തിരിക്കുക...</div>

        <!-- She Fest Tab -->
        <div id="shefestTab" class="tab-content">
            <h2>Shefest Schedule</h2>
            <div id="shefestList"></div>
        </div>

        <!-- He Fest Tab -->
        <div id="hefestTab" class="tab-content hidden">
            <h2>Hefest Schedule</h2>
            <div id="hefestList"></div>
        </div>

        <!-- Results Tab -->
        <div id="resultsTab" class="tab-content hidden">
            <h2>Fest Results</h2>
            <div id="resultsList"></div>
        </div>

        <!-- Quiz Tab -->
        <div id="quizTab" class="tab-content hidden">
            <h2>Live Quiz</h2>
            <div id="quizContainer">
                <p id="quizStatusMsg">ക്വിസ് ഇതുവരെ ആരംഭിച്ചിട്ടില്ല. കാത്തിരിക്കുക...</p>
                <div id="questionBox" class="hidden">
                    <p id="qText" style="font-weight: bold; margin-bottom: 15px;"></p>
                    <button class="quiz-option" id="optA" onclick="submitAnswer('A')"></button>
                    <button class="quiz-option" id="optB" onclick="submitAnswer('B')"></button>
                    <button class="quiz-option" id="optC" onclick="submitAnswer('C')"></button>
                    <button class="quiz-option" id="optD" onclick="submitAnswer('D')"></button>
                </div>
            </div>
        </div>

        <!-- Feedback Tab -->
        <div id="feedbackTab" class="tab-content hidden">
            <h2>ഫീഡ്‌ബാക്ക് നൽകുക</h2>
            <div class="form-group">
                <textarea id="feedbackText" rows="4" placeholder="നിങ്ങളുടെ അഭിപ്രായങ്ങൾ ഇവിടെ എഴുതുക..."></textarea>
            </div>
            <button onclick="sendFeedback()">ഫീഡ്‌ബാക്ക് അയക്കുക</button>
        </div>
    </div>
</div>

<script>
    // ** ഇവിടെ നിങ്ങളുടെ ഗൂഗിൾ ആപ്പ്സ് സ്ക്രിപ്റ്റിന്റെ വെബ് ആപ്പ് ലിങ്ക് നൽകുക **
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbybS1JgP0W0CaFI7BR4wI1OoSO6zv86cBr0OwqerI9cOZmpEh1ngIcnYExyRBTe7JUYEw/exec";

    let isRegisterMode = false;
    let currentUser = null;
    let currentMobile = null;
    let appData = { schedule: [], boysSchedule: [], results: [] };
    let currentQuizData = null;

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('authTitle').innerText = isRegisterMode ? "പുതിയ രജിസ്ട്രേഷൻ" : "ലോഗിൻ ചെയ്യുക";
        document.getElementById('authBtn').innerText = isRegisterMode ? "രജിസ്റ്റർ ചെയ്യുക" : "ലോഗിൻ";
    }

    function handleAuth() {
        const name = document.getElementById('nameInput').value.trim();
        const mobile = document.getElementById('mobileInput').value.trim();

        if (!mobile || (isRegisterMode && !name)) {
            alert("എല്ലാ വിവരങ്ങളും കൃത്യമായി നൽകുക!");
            return;
        }

        const action = isRegisterMode ? "register" : "login";
        
        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: action, name: name, mobile: mobile })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                currentUser = data.name || name;
                currentMobile = mobile;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                fetchAllData();
                setInterval(fetchQuizData, 5000); // Check quiz every 5 seconds
            } else if (data.status === "exists") {
                alert("ഈ നമ്പർ ഇതിനകം രജിസ്റ്റർ ചെയ്തിട്ടുണ്ട്. ലോഗിൻ ചെയ്യുക.");
            } else if (data.status === "not_found") {
                alert("ഈ നമ്പർ കണ്ടെത്താനായില്ല. ദയവായി രജിസ്റ്റർ ചെയ്യുക.");
            } else if (data.status === "blocked") {
                alert("നിങ്ങളുടെ അക്കൗണ്ട് ബ്ലോക്ക് ചെയ്തിരിക്കുന്നു.");
            } else {
                alert("എന്തോ കുഴപ്പം സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.");
            }
        })
        .catch(err => alert("ചെക്ക് ചെയ്യാൻ കഴിഞ്ഞില്ല: " + err));
    }

    function fetchAllData() {
        fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
            appData = data;
            document.getElementById('loading').classList.add('hidden');
            renderShefest();
            renderHefest();
            renderResults();
        })
        .catch(err => console.error(err));
    }

    function renderShefest() {
        const container = document.getElementById('shefestList');
        container.innerHTML = appData.schedule.map(item => `
            <div class="card">
                <p><b>സമയം:</b> ${item.Time || ''}</p>
                <p><b>വിഷയം/ഇനം:</b> ${item['Program Type'] || ''}</p>
                <p><b>പേര്:</b> ${item['Student Name'] || ''} (ക്ലാസ്: ${item.Class || ''})</p>
            </div>
        `).join('') || '<p>ഡാറ്റ ലഭ്യമല്ല</p>';
    }

    function renderHefest() {
        const container = document.getElementById('hefestList');
        container.innerHTML = appData.boysSchedule.map(item => `
            <div class="card">
                <p><b>സമയം:</b> ${item.Time || ''}</p>
                <p><b>വിഷയം/ഇനം:</b> ${item['Program Type'] || ''}</p>
                <p><b>പേര്:</b> ${item['Student Name'] || ''} (ക്ലാസ്: ${item.Class || ''})</p>
            </div>
        `).join('') || '<p>ഡാറ്റ ലഭ്യമല്ല</p>';
    }

    function renderResults() {
        const container = document.getElementById('resultsList');
        container.innerHTML = appData.results.map(item => `
            <div class="card">
                <p><b>ഇനം:</b> ${item['Program Type'] || ''}</p>
                <p><b>വിജയി:</b> ${item['Student Name'] || ''} (ക്ലാസ്: ${item.Class || ''})</p>
            </div>
        `).join('') || '<p>റിസൾട്ട് ലഭ്യമല്ല</p>';
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabName + 'Tab').classList.remove('hidden');
        event.target.classList.add('active');
    }

    function fetchQuizData() {
        fetch(WEB_APP_URL + "?action=getQuiz")
        .then(res => res.json())
        .then(data => {
            const statusMsg = document.getElementById('quizStatusMsg');
            const qBox = document.getElementById('questionBox');
            
            if (data.status === "STARTED" && data.question) {
                currentQuizData = data.question;
                statusMsg.classList.add('hidden');
                qBox.classList.remove('hidden');
                
                document.getElementById('qText').innerText = data.question.QuestionText;
                document.getElementById('optA').innerText = "A) " + data.question.OptionA;
                document.getElementById('optB').innerText = "B) " + data.question.OptionB;
                document.getElementById('optC').innerText = "C) " + data.question.OptionC;
                document.getElementById('optD').innerText = "D) " + data.question.OptionD;
            } else {
                statusMsg.classList.remove('hidden');
                statusMsg.innerText = data.status === "WAITING" ? "ക്വിസ് ആരംഭിക്കാൻ കാത്തിരിക്കുന്നു..." : "ക്വിസ് അവസാനിച്ചു!";
                qBox.classList.add('hidden');
            }
        });
    }

    function submitAnswer(selectedOpt) {
        if (!currentQuizData) return;
        const isCorrect = (selectedOpt === currentQuizData.CorrectAnswer);
        
        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "submitQuiz",
                mobile: currentMobile,
                name: currentUser,
                qId: currentQuizData.QuestionID,
                isCorrect: isCorrect
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                alert(isCorrect ? "ശരിയുത്തരം! 🎉" : "തെറ്റുത്തരം! ❌");
            }
        });
    }

    function sendFeedback() {
        const feedback = document.getElementById('feedbackText').value.trim();
        if (!feedback) {
            alert("ദയവായി ഫീഡ്‌ബാക്ക് എഴുതുക!");
            return;
        }

        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "feedback",
                mobile: currentMobile,
                name: currentUser,
                feedback: feedback
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                alert("ഫീഡ്‌ബാക്ക് വിജയകരമായി അയച്ചു! നന്ദി.");
                document.getElementById('feedbackText').value = "";
            }
        });
    }
</script>

</body>
</html>
