<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She Fest 2026</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0f172a; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .card { background: #fff; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        h3 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<div id="auth" class="box">
    <h2 id="title" style="text-align:center;">Login</h2>
    <input type="text" id="name" placeholder="Name (for registration only)" style="display:none;">
    <input type="text" id="mobile" placeholder="Mobile Number">
    <button id="btn" onclick="submitAuth()">Login</button>
    <p style="text-align:center; color:blue; cursor:pointer; font-size: 14px;" onclick="toggleMode()">Don't have an account? Register</p>
</div>

<div id="app" style="display:none; max-width: 600px; margin: auto;">
    <h1>She Fest Dashboard</h1>
    <button onclick="logout()" style="background: #ef4444; width: auto; padding: 8px 15px; margin-bottom: 15px;">Logout</button>
    <div id="data-container"></div>
</div>

<script>
    const url = "https://script.google.com/macros/s/AKfycbzWIXHvep1jvvvhEr_HkJgoEmUPPEv_G0gx-PkKPjHlv9_Mk5OWodWInUV5sGDcYkWvjQ/exec"; // <-- പുതിയ വെബ് ആപ്പ് ലിങ്ക് ഇവിടെ നൽകുക
    let mode = "login";

    window.onload = function() {
        if (localStorage.getItem("she_fest_user")) {
            document.getElementById("auth").style.display = "none";
            document.getElementById("app").style.display = "block";
            fetchData();
        }
    }

    function toggleMode() {
        mode = mode === "login" ? "register" : "login";
        document.getElementById("titleinnerText" || "title").innerText = mode === "login" ? "Login" : "Register";
        document.getElementById("btn").innerText = mode === "login" ? "Login" : "Register";
        document.getElementById("name").style.display = mode === "register" ? "block" : "none";
    }

    async function submitAuth() {
        let mobile = document.getElementById("mobile").value.trim();
        let name = document.getElementById("name").value.trim();
        
        if(!mobile) { alert("Please enter mobile number"); return; }
        if(mode === "register" && !name) { alert("Please enter name"); return; }

        let res = await fetch(url, {
            method: "POST",
            body: JSON.stringify({action: mode, mobile: mobile, name: name})
        });
        let data = await res.json();
        
        if(data.status === "success") {
            if(mode === "login") {
                localStorage.setItem("she_fest_user", mobile);
                document.getElementById("auth").style.display = "none";
                document.getElementById("app").style.display = "block";
                fetchData();
            } else {
                alert("Registered successfully! Please wait for admin approval.");
                toggleMode();
            }
        } else if(data.status === "exists") {
            alert("Mobile number already registered!");
        } else if(data.status === "pending") {
            alert("Your account is pending admin approval.");
        } else {
            alert("Mobile number not registered.");
        }
    }

    async function fetchData() {
        try {
            let res = await fetch(url);
            let data = await res.json();
            
            let html = "";
            
            // 1. Schedule Data
            html += "<h3>📅 Schedule (Sheet1)</h3>";
            if(data.schedule && data.schedule.length > 0) {
                data.schedule.forEach(i => {
                    html += `<div class="card"><b>${i['Program Type'] || ''}</b><br><small>Time: ${i['Time'] || ''} | Student: ${i['Student Name'] || ''} (${i['Class'] || ''})</small></div>`;
                });
            } else { html += "<p>No schedule data found.</p>"; }
            
            // 2. Results Data
            html += "<h3>🏆 Results (Sheet2)</h3>";
            if(data.results && data.results.length > 0) {
                data.results.forEach(i => {
                    html += `<div class="card"><b>${i['Program Name'] || ''}</b> (${i['Category'] || ''})<br>🥇 1st: ${i['1st Place'] || 'N/A'}<br>🥈 2nd: ${i['2nd Place'] || 'N/A'}<br>🥉 3rd: ${i['3rd Place'] || 'N/A'}</div>`;
                });
            } else { html += "<p>No results found.</p>"; }
            
            // 3. Users Data
            html += "<h3>👥 Registered Users (Users)</h3>";
            if(data.users && data.users.length > 0) {
                data.users.forEach(i => {
                    html += `<div class="card">Name: <b>${i['Name']}</b> | Mobile: ${i['Mobile']} | Status: <b>${i['Status']}</b></div>`;
                });
            } else { html += "<p>No users found.</p>"; }
            
            document.getElementById("data-container").innerHTML = html;
        } catch (err) {
            console.log("Error fetching data:", err);
        }
    }

    function logout() {
        localStorage.removeItem("she_fest_user");
        location.reload();
    }
</script>
</body>
</html>
